<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEPAND FAMI</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ee;--sf:#fff;--tx:#26233a;--mu:#8a8499;--ln:#ece6dd;--pr:#4f46e5;--g1:linear-gradient(135deg,#4f46e5,#7c3aed);--g2:linear-gradient(135deg,#ffb454,#ff7a59);--ok:#10b981;--bad:#ef4444;--wr:#f59e0b;--pu:#4f46e5}
[data-t=dark]{--bg:#14131c;--sf:#1f1d2b;--tx:#efedf7;--mu:#a29db5;--ln:#2e2b3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.8 Vazirmatn,Tahoma,sans-serif}
#app{max-width:640px;margin:auto;padding:0 14px 100px}
.hd{position:sticky;top:0;z-index:5;margin:0 -14px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:6px}
.hd b{flex:1;font-size:17px;font-weight:800;color:var(--pr);letter-spacing:.4px}.hd button{background:var(--sf);color:var(--tx);padding:6px 10px;box-shadow:0 1px 5px #0001;position:relative}
.bd{position:absolute;top:-4px;left:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
button{font:inherit;border:0;border-radius:16px;padding:10px 16px;color:#fff;background:var(--g1);cursor:pointer;transition:.2s;font-weight:600}button:active{transform:scale(.96)}
.b2{background:var(--ln);color:var(--tx)}.bg{background:var(--g2)}.br{background:var(--bad)}.w{width:100%}
input,select,textarea{width:100%;padding:12px;margin:4px 0;border:1.5px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr)}
.card{background:var(--sf);border-radius:24px;padding:16px;margin:12px 0;border:1px solid var(--ln);animation:fi .35s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@keyframes pl{0%{box-shadow:0 0 0 0 var(--pc)}100%{box-shadow:0 0 0 12px #0000}}
h1,h2,h3{margin:8px 0 4px}h1{font-size:24px}h2{font-size:17px}small,.mu{color:var(--mu);font-size:12.5px}
.hero{background:var(--g1);color:#fff;border-radius:30px;padding:22px;margin:14px 0;position:relative;overflow:hidden;box-shadow:0 14px 30px #4f46e544}
.hero:before,.hero:after{content:'';position:absolute;border-radius:50%;background:#ffffff1c}.hero:before{left:-40px;top:-50px;width:160px;height:160px}.hero:after{left:60px;bottom:-60px;width:120px;height:120px;background:#ffb4541f}.hero small{color:#ffffffcc}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button,.row>.sp{flex:none}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;background:var(--ln);color:var(--tx)}.tabs .on{background:var(--g1);color:#fff}
.chip{display:inline-block;padding:1px 11px;border-radius:99px;background:var(--ln);font-size:12px;margin:2px}.chip.on{background:var(--g1);color:#fff}
.pb{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g1);border-radius:9px;transition:.5s}
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:616px;margin:auto;z-index:5;background:var(--sf);display:flex;gap:2px;padding:6px;border-radius:28px;box-shadow:0 10px 34px #26233a26;border:1px solid var(--ln)}
.nav button{background:none;color:var(--mu);flex:1;padding:5px;font-size:11px;line-height:1.4;border-radius:20px;font-weight:400}.nav button.on{color:var(--pr);background:#4f46e51a;font-weight:800}.nav span{display:block;font-size:20px}
.lg2{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}.lg2 .sp{font-size:11px}
.sp{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.sp.done{background:#10b9811f;color:#059669}.sp.cur{background:#fff;color:#4f46e5}.sp.next{background:#f59e0b26;color:#b45309}.sp.over{background:#ef44441f;color:#dc2626}.sp.lock{background:var(--ln);color:var(--mu)}
.tl{position:relative;padding-right:34px}.tl:before{content:"";position:absolute;right:8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--ln)}
.st{position:relative;background:var(--sf);border-radius:24px;padding:14px 16px;margin:14px 0;cursor:pointer;border:1.5px solid var(--ln);transition:.2s}
.st:before{content:"";position:absolute;right:-34px;top:18px;width:18px;height:18px;border-radius:50%;background:#c9c3d6;border:3px solid var(--bg)}
.st.done{background:#10b9810d;border-color:#10b98155}.st.done:before{background:var(--ok)}
.st.over{background:#ef44440d;border-color:#ef444477}.st.over:before{background:var(--bad)}
.st.cur{background:var(--g1);color:#fff;border:0;transform:scale(1.02);box-shadow:0 12px 28px #4f46e55c}.st.cur:before{background:#4f46e5;--pc:#4f46e599;animation:pl 1.4s infinite}
.st.cur .dt{color:#ffffffbb}.st.cur .chip{background:#ffffff30;color:#fff}.st.cur .dev{background:#ffffff26;color:#fff}
.st.next{background:#f59e0b12;border:2px dashed #f59e0b}.st.next:before{background:#f59e0b;--pc:#f59e0b99;animation:pl 1.4s infinite}
.st.lock{opacity:.6}
.dt{font:11px monospace;color:var(--mu)}.dev{background:var(--bg);border-radius:14px;padding:6px 10px;font-size:13px;margin-top:8px}
.mo{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--sf);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:fi .3s}
canvas{width:100%;height:320px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;touch-action:none;direction:ltr}
.ck{display:flex;gap:10px;padding:6px 0;align-items:flex-start}.ck input{width:20px;margin-top:6px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal div{padding:6px 0;min-height:46px;border-radius:14px;font-size:13px}
.cal .ev{font-weight:800;cursor:pointer;transition:.2s}.cal .ev:active{transform:scale(.92)}
.cal .ev.c{background:#4f46e51f;box-shadow:inset 0 0 0 1px #4f46e555}.cal .ev.v{background:linear-gradient(135deg,#ffb45455,#ff7a5966);box-shadow:inset 0 0 0 1px #ff7a5988}
.cal .td{outline:2px solid var(--tx);outline-offset:1px}.vi{display:block;font-size:10px;line-height:1.1}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-top:10px;flex-wrap:wrap}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-left:4px}
.rm{padding:9px 12px;border-radius:16px;margin:6px 0;background:#4f46e514}.rm.r{background:#ef444420}
.ln{display:block;font-size:20px;direction:ltr;text-align:center;user-select:all;font-weight:800;margin:6px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:16px;z-index:30}
.edu-section{margin:14px 0}.edu-section h3{font-size:15px;margin:0 0 4px}.edu-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.edu-table th{background:var(--ln);padding:6px 8px;text-align:right}.edu-table td{padding:6px 8px;border-bottom:1px solid var(--ln)}.edu-tip{border-radius:16px;padding:10px 12px;margin:12px 0;background:#4f46e514;border-right:4px solid var(--pr)}.edu-tip.good{background:#10b9811a;border-color:var(--ok)}.edu-tip.warn{background:#f59e0b1f;border-color:var(--wr)}.edu-tip.danger{background:#ef44441a;border-color:var(--bad)}.tip-title{font-weight:800;margin-bottom:2px}.edu-checklist{display:flex;flex-direction:column;gap:6px}.edu-check-item{display:flex;gap:8px;align-items:flex-start}.bullet{flex:none;min-width:22px;text-align:center}
